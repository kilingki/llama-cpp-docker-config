services:
  llama-runtime:
    build:
      context: .
      dockerfile: Dockerfile
    image: llama-cpp-docker-runtime:local
    init: true
    ports:
      - "${PUBLIC_PORT:-8000}:8000"
    volumes:
      - ${HOST_MODELS_DIR:?Set HOST_MODELS_DIR in .env}:/models:ro
    env_file:
      - configs/common.env
      - configs/models/${MODEL_PROFILE:-qwen3.8-27b}.env
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    gpus: all
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
